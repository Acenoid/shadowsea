<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>ShadowSea</title>


    <link rel='stylesheet prefetch' href='https://cdn.jsdelivr.net/npm/jquery.terminal@2/css/jquery.terminal.min.css'>

    <style>
        body {
            margin: 0;
            background: black;
        }
        #term {
            height: 100vh;
            --background: #031e11;
            --size: 1.5;
        }
        /* to see yourself like in a mirror */
        .self {
            transform: scale(-1, 1);
        }
        /* flicker animation taken from http://goonhub.com/secret */
        #term::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: rgba(18, 16, 16, 0.2);
            opacity: 0;
            z-index: 2;
            pointer-events: none;
            animation: flicker 0.12s infinite;
        }
        @keyframes flicker {
        0% {
            opacity: 0.552;
        }
        5% {
            opacity: 0.48287;
        }
        10% {
            opacity: 0.59134;
        }
        15.0% {
            opacity: 0.79543;
        }
        20% {
            opacity: 0.75134;
        }
        25% {
            opacity: 0.1956;
        }
        30.0% {
            opacity: 0.90687;
        }
        35% {
            opacity: 0.122;
        }
        40% {
            opacity: 0.62254;
        }
        45% {
            opacity: 0.56977;
        }
        50% {
            opacity: 0.9925;
        }
        55.0% {
            opacity: 0.55487;
        }
        60.0% {
            opacity: 0.16607;
        }
        65% {
            opacity: 0.12353;
        }
        70% {
            opacity: 0.2214;
        }
        75% {
            opacity: 0.67908;
        }
        80% {
            opacity: 0.97163;
        }
        85.0% {
            opacity: 0.1275;
        }
        90% {
            opacity: 0.37186;
        }
        95% {
            opacity: 0.24475;
        }
        100% {
            opacity: 0.37221;
        }
        }
        /*
        * reference: https://developer.mozilla.org/en-US/docs/Web/CSS/:focus-within
        */
        .cmd:focus-within .prompt {
            color: red;
        }
        /* glow */
        .terminal {
            text-shadow: 0 0.2rem 1rem #0c7b46;
        }
        /* based on
        https://blog.carbonfive.com/2015/01/07/vintage-terminal-effect-in-css3/
        */
        .scanlines {
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,.2) 70%,
                rgba(0,0,0,.6)
            );
            background-size: 100% .3rem;
            position: fixed;
            pointer-events: none;
        }
        .scanlines:before {
        position: absolute;
        top: 0px;
        width: 100%;
        height: 5px;
        background: #fff;
        background: linear-gradient(to bottom,
            rgba(255,0,0,0) 0%,
            rgba(255,250,250,1) 50%,
            rgba(255,255,255,0.98) 51%,
            rgba(255,0,0,0) 100%
        ); /* W3C */
        opacity: .1;
        }
        .scanlines:after {
        box-shadow: 0 2px 6px rgba(25,25,25,0.2),
            inset 0 1px rgba(50,50,50,0.1),
            inset 0 3px rgba(50,50,50,0.05),
            inset 0 3px 8px rgba(64,64,64,0.05),
            inset 0 -5px 10px rgba(25,25,25,0.1);
        }

        #term:focus-within + .scanlines:before {
        content: '';
        animation: vline calc(var(--time, 2) * 1s) linear infinite;
        }
        /*
        * MS Edge don't support focus-within and css vars
        * inside pseudo selector
        */
        @supports (-ms-ime-align:auto) {
            .scanlines:before {
                content: '';
                animation: vline 3s linear infinite;
            }
        }
        @keyframes vline {
        to { transform: translate(0, 100vh)}
        }
        /* turn off animation */
        .tv {
            height: 100vh;
            position: relative;
        }
        @keyframes opacity {
            to { opacity: 1; }
        }
        @keyframes size {
            50% {
                transform: scaleX(calc(1 / var(--width)));
                opacity: 1;
            }
            98% {
                transform: scaleX(calc(1 / var(--width))) scaleY(calc(1 / var(--height)));
                opacity: 1;
            }
            100% {
                transform: scaleX(calc(1 / var(--width))) scaleY(calc(1 / var(--height)));
                opacity: 0;
            }
        }
    </style>


</head>

<body>
    <div class="tv">
        <div id="term"></div>
        <div class="scanlines"></div>
    </div>

    <script src='https://code.jquery.com/jquery-3.1.1.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/jquery.terminal@2/js/jquery.terminal.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/jquery-mousewheel/jquery.mousewheel.min.js'></script>
    <script src='https://cdn.jsdelivr.net/gh/inexorabletash/polyfill/keyboard.js'></script>
    <script src='https://unpkg.com/treeify@1.0.1/treeify.js'></script>

<script>
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    $.ajaxSetup({
        beforeSend: function(xhr, settings) {
            if (!/^(GET|HEAD|OPTIONS|TRACE)$/i.test(settings.type)) {
                xhr.setRequestHeader("X-CSRFToken", getCookie('csrftoken'));
            }
        }
    });
</script>

    <script>

        var header = `   _____ __              __              _____
  / ___// /_  ____ _____/ /___ _      __/ ___/___  ____ _
  \\__ \\/ __ \\/ __ \`/ __  / __ \\ | /| / /\\__ \\/ _ \\/ __ \`/
 ___/ / / / / /_/ / /_/ / /_/ / |/ |/ /___/ /  __/ /_/ /
/____/_/ /_/\\__,_/\\__,_/\\____/|__/|__//____/\\___/\\__,_/
Copyright (c) 2050-2055
`

        var scanlines = $('.scanlines');
        var tv = $('.tv');

        thread_id = null;
        login_creds = null;
        thread_list_cache = [];

        function login(user, pass, callback) {
            term.push(function (user) {
                if (!user.trim()) {
                    term.error('username cannot be empty');
                    return;
                }
                term.set_mask('*').push(function (pass) {
                    if (!pass) {
                        term.error('password cannot be empty');
                        term.pop(undefined, true);
                        return;
                    }
                    login_cred = user + '$' + pass;

                    $.post('/auth/login/', { token: login_cred }).then(function (response) {
                        if (response.success) {
                            term.echo('logged in as ' + user)
                            login_creds = login_cred;
                        } else {
                            term.echo('login failed')
                        }
                    });

                    term.pop(undefined, true).pop(undefined, true);
                }, {
                    prompt: 'password: ',
                    name: 'password'
                });
            }, {
                prompt: 'username: ',
                name: 'username'
            });
        }

        function register() {
            term.pause();
            $.get('/auth/invite-required/')
                .always(function(response) {
                    term.resume();
                    var inviteRequired = response && response.required;

                    function doRegister(invite_code) {
                        term.push(function (user) {
                            if (!user.trim()) {
                                term.error('username cannot be empty');
                                return;
                            }
                            term.set_mask('*').push(function (pass) {
                                if (!pass) {
                                    term.error('password cannot be empty');
                                    term.pop(undefined, true);
                                    return;
                                }
                                var login_cred = user + '$' + pass;
                                var payload = { token: login_cred };
                                if (inviteRequired) payload.invite_code = invite_code;

                                term.pause();

                                $.post('/auth/register/', payload)
                                    .then(function (response) {
                                        term.echo('user created')
                                    })
                                    .fail(function(response) {
                                        term.error(response.responseJSON.error || 'an error occurred')
                                    })
                                    .always(function () {
                                        term.resume();
                                        term.pop(undefined, true).pop(undefined, true);
                                    })

                            }, {
                                prompt: 'password: ',
                                name: 'password'
                            });
                        }, {
                            prompt: 'username: ',
                            name: 'username'
                        });
                    }

                    if (inviteRequired) {
                        term.push(function (code) {
                            term.pop(undefined, true);
                            doRegister(code);
                        }, {
                            prompt: 'invite code: ',
                            name: 'invite_code'
                        });
                    } else {
                        doRegister('');
                    }
                });
        }

        function status() {
            $.get('/status/', {})
                .done(function (response) {
                    tree(response);
                })
        }

        function post_thread() {
            term.echo('posting new thread...')

            term.push(function (vis) {
                var v = vis.trim().toLowerCase();
                if (v !== 'p' && v !== 'r' && v !== '') {
                    term.error('please enter P (public) or R (registered only)');
                    return;
                }
                var restricted = (v === 'r');
                term.pop(undefined, true);

                term.push(function (title) {
                    term.push(function (content) {
                        term.pause()

                        $.post('/thread/post/', {
                            title: title,
                            content: content,
                            restricted: restricted ? 'true' : 'false'
                        })
                        .done(function(response) {
                            term.echo('created thread ' + response.thread_id + (restricted ? ' [registered only]' : ' [public]'))
                        })
                        .fail(function(response) {
                            term.error('an error occurred')
                        })
                        .always(function(response) {
                            term.resume()
                            term.pop(undefined, true).pop(undefined, true);
                        })
                    }, {
                        prompt: 'content: ',
                        name: 'content'
                    });
                }, {
                    prompt: 'title: ',
                    name: 'title'
                });
            }, {
                prompt: 'visibility (P=public / r=registered only): ',
                name: 'visibility'
            });
        }

        function post_reply() {
            term.echo('posting new reply...')

            term.push(function (content) {
                term.pause();
                $.post('/thread/' + thread_id + '/post/', {
                    content: content
                })
                    .done(function (response) {
                        term.echo('created post in thread ' + thread_id)
                    })
                    .fail(function (response) {
                        term.error('an error occurred')
                    })
                    .always(function (response) {
                        term.resume();
                        term.pop(undefined, true)
                    })

            }, {
                prompt: 'content: ',
                name: 'content'
            });
        }

        function list_threads() {
            term.pause();
            $.get('/thread/list/', {})
                .done(function (response) {
                    term.echo("[[;#fff;]  id u                author title                                   posts                date]")
                    thread_list_cache = response;
                    for (r in response) {
                        var t = response[r];
                        var line =
                            t.id.toString().padStart(4, ' ') +
                            (t.unread ? ' *' : '  ') +
                            t.poster.toString().padStart(22, ' ') + ' ' +
                            t.name.substring(0, 38).toString().padEnd(39, ' ') +
                            t.posts.toString().padStart(6, ' ') +
                            t.date.toString().padStart(20, ' ');

                        if (t.restricted) {
                            term.echo('[[;#555;]' + line + ']');
                        } else {
                            term.echo(line);
                        }
                    }
                })
                .always(function (response) {
                    term.resume();
                })
        }

        function list_posts() {
            term.pause();
            $.get('/thread/' + thread_id + '/', {})
                .done(function (response) {
                    try {
                        for (r in response) {
                            term.echo('[[;#fff;]' + response[r].poster.toString().padEnd(24, ' ') + ' ' + response[r].date.toString()) + ']';
                            term.echo(response[r].text + '\n');
                        }
                    } catch(e) {
                        term.error('an error occurred');
                    }
                })
                .fail(function(xhr) {
                    if (xhr.status === 403) {
                        term.error('access denied: this thread is for registered users only');
                        thread_id = null;
                    } else {
                        term.error('an error occurred');
                    }
                })
                .always(function (response) {
                    term.resume();
                })
        }

        function get_prompt(cb) {
            cb(thread_id == null ? "shadow> " : "shadow " + thread_id + "> ")
        }

        function interpret(command, term) {
            c = $.terminal.parse_command(command);

            console.log(c);

            if (c.name == '') {
                term.echo('')
            }
            else if (c.name == 'help' || c.name == '?') {
                term.echo('[[;#fff;]Available commands:]');
                term.echo('  list / ls          — list threads (or posts inside a thread)');
                term.echo('  thread <id> / cd <id> — open a thread by ID');
                term.echo('  cd ..              — go back to thread list');
                term.echo('  back               — go back to thread list');
                term.echo('  post               — create a new thread (or reply inside a thread)');
                term.echo('  login              — log in to your account');
                term.echo('  register           — create a new account');
                term.echo('  status             — show current login status');
                term.echo('  help / ?           — show this help');
            }
            else if (c.name == 'list' || c.name == 'ls') {
                if (thread_id == null) {
                    list_threads()
                } else {
                    list_posts()
                }
            }
            else if (c.name == 'login') {
                login();
            }
            else if (c.name == 'register') {
                register();
            }
            else if (c.name == 'status') {
                status();
            }
            else if (c.name == 'back') {
                if (thread_id == null) {
                    term.error("you are already at the root");
                }
                thread_id = null;
            }
            else if (c.name == 'post') {
                if (login_creds == null && false) {
                    term.error('you must be logged in to post')
                } else if (thread_id == null) {
                    post_thread();
                } else {
                    post_reply();
                }
            }
            else if (c.name == 'thread' || c.name == 'cd') {
                if (c.args.length != 1) {
                    term.error('you must provide a thread ID');
                    return;
                }

                if (c.args[0] === '..') {
                    if (thread_id === null) {
                        term.error("you are already at the root");
                    } else {
                        thread_id = null;
                    }
                    return;
                }

                var id = parseInt(c.args[0], 10);
                if (isNaN(id) || id <= 0 || id.toString() !== c.args[0].toString()) {
                    term.error('thread ID must be a positive integer');
                    return;
                }

                var cached = thread_list_cache.find(function(t) { return t.id === id; });
                if (cached && cached.restricted) {
                    term.error('access denied: this thread is for registered users only');
                    return;
                }

                thread_id = id;
                term.echo('selected thread ' + thread_id);
            }
            else {
                term.error('unknown command');
            }
        }

        function on_init() {
            set_size();
            term = this;

            term.pause();

            setTimeout(function () {
                term.echo('Establishing secure connection...');
            }, 0);
            setTimeout(function () {
                term.echo('Diffie-Hellman key exchange complete');
            }, 850);
            setTimeout(function () {
                term.echo('Attempting to establish bidirectional AES channel...');
            }, 1100);
            setTimeout(function () {
                term.error('Failed to establish symmetrical AES channel (not supported by your comlink)');
            }, 1650);
            setTimeout(function () {
                term.echo('Attempting to establish bidirectional Kuznyechik channel...');
            }, 1700);
            setTimeout(function () {
                term.echo('Symmetrical Kuznyechik-encrypted channel (8192 bit) established');
            }, 2250);
            setTimeout(function () {
                term.echo('Rerouting of network traffic over meshnet complete\n');
            }, 2525);

            setTimeout(function () {
                term.echo('Your ShadowSea software is up to date (v0.27.4A)');
                uuid = Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
                term.echo('Generated unique session ID ' + uuid);
            }, 2750);

            setTimeout(function () {
                term.echo('\n[[;#000;#fff]Welcome to ShadowSea]');
            }, 2850);

            setTimeout(function () {
                term.echo('\nType [[b;#fff;]list] to view threads or [[b;#fff;]thread <id>] to select one or [[b;#fff;]post].');
                term.echo('Similar commands navigate through threads.');
                term.echo('Type [[b;#fff;]back] to go back.\n');
                term.echo('To create an account, type [[b;#fff;]register]. If you have one, [[b;#fff;]login].\n');
                term.resume();
            }, 2900);
        }

        var term = $('#term').terminal(interpret, {
            memory: true,
            onResize: set_size,
            greetings: header,
            exit: false,
            onInit: on_init,
            prompt: get_prompt,
            numChars: 100
        });

        function set_size() {
            var height = $(window).height();
            var width = $(window).width()
            var time = (height * 2) / 170;
            scanlines[0].style.setProperty("--time", time);
            tv[0].style.setProperty("--width", width);
            tv[0].style.setProperty("--height", height);
        }

        function tree(obj) {
            term.echo(treeify.asTree(obj, true, true));
        }

    </script>
</body>

</html>
